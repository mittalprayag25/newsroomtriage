[project]
name = "st-newsroom-agent"
version = "0.2.0"
description = "Straits Times newsroom mail: triage, then calendar and draft specialists."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "mammoth>=1.8",
  "pydantic>=2.9",
  "pypdf>=5",
  "python-multipart>=0.0.9",
  "uvicorn>=0.32",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

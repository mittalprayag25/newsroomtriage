[project]
name = "st-newsroom-agent"
version = "0.1.0"
description = "Local triage for Straits Times newsroom mail. Stops at a route decision."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "pydantic>=2.9",
  "python-multipart>=0.0.9",
  "uvicorn>=0.32",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
